<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="86" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />
  
  <!-- Lab Flask & Microscope Graphic -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Medical Cross in top corner -->
    <rect x="360" y="70" width="18" height="54" rx="6" fill="#38bdf8" />
    <rect x="342" y="88" width="54" height="18" rx="6" fill="#38bdf8" />

    <!-- Microscope Base Plate -->
    <rect x="136" y="390" width="240" height="30" rx="15" fill="#f8fafc" />
    <rect x="236" y="350" width="40" height="45" fill="#cbd5e1" />

    <!-- Microscope Stage & Arm -->
    <path d="M 170 330 L 310 330 A 8 8 0 0 1 318 338 L 318 344 A 8 8 0 0 1 310 352 L 170 352 A 8 8 0 0 1 162 344 L 162 338 A 8 8 0 0 1 170 330 Z" fill="#e2e8f0" />
    
    <!-- Curved Arm -->
    <path d="M 280 200 C 350 200 350 340 280 345 L 260 345 C 320 340 320 230 260 230 Z" fill="#f8fafc" />

    <!-- Microscope Body Tube / Head (Angled) -->
    <g transform="rotate(-30 220 200)">
      <!-- Eyepiece Tube -->
      <rect x="202" y="90" width="36" height="50" rx="6" fill="#cbd5e1" />
      <rect x="194" y="80" width="52" height="16" rx="6" fill="#f8fafc" />
      <!-- Main Body -->
      <rect x="196" y="135" width="48" height="110" rx="8" fill="#f8fafc" />
      <rect x="204" y="160" width="32" height="40" rx="4" fill="#38bdf8" />
      <!-- Revolving Nosepiece / Objectives -->
      <path d="M 190 245 L 250 245 L 240 265 L 200 265 Z" fill="#cbd5e1" />
      <rect x="204" y="265" width="14" height="32" rx="3" fill="#f8fafc" />
      <rect x="222" y="265" width="14" height="24" rx="3" fill="#94a3b8" />
    </g>

    <!-- Adjustment Knobs -->
    <circle cx="315" cy="270" r="16" fill="#38bdf8" />
    <circle cx="315" cy="270" r="8" fill="#f8fafc" />
  </g>
  
  <!-- Subtle Sparkles -->
  <circle cx="120" cy="140" r="8" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="150" cy="110" r="4" fill="#38bdf8" fill-opacity="0.9" />
  <circle cx="390" cy="210" r="6" fill="#ffffff" fill-opacity="0.7" />
</svg>
